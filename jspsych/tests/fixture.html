<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>contingency: test fixture</title>
    <script src="https://unpkg.com/jspsych@8.3.0"></script>
    <script src="../dist/index.browser.js"></script>
  </head>
  <body></body>
  <script>
    // The trial parameters come from ?trial=<JSON>, or a list of them from ?timeline=<JSON>.
    const query = new URLSearchParams(location.search);
    const trials = query.has("timeline")
      ? JSON.parse(query.get("timeline"))
      : [JSON.parse(query.get("trial"))];
    const jsPsych = initJsPsych({
      on_finish: function () {
        window.experimentFinished = true;
      },
    });
    jsPsych.run(trials.map((params) => Object.assign({ type: jsPsychContingency }, params)));
  </script>
</html>
