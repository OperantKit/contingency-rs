<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>contingency: test fixture</title>
    <script src="https://unpkg.com/jspsych@8.3.0"></script>
    <script src="../dist/index.browser.js"></script>
  </head>
  <body></body>
  <script>
    // The trial parameters come from ?trial=<JSON>.
    const params = JSON.parse(new URLSearchParams(location.search).get("trial"));
    const jsPsych = initJsPsych({
      on_finish: function () {
        window.experimentFinished = true;
      },
    });
    jsPsych.run([Object.assign({ type: jsPsychContingency }, params)]);
  </script>
</html>
