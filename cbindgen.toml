language = "C"
header = "/* contingency C API — auto-generated by cbindgen. Do not edit. */"
include_guard = "CONTINGENCY_H"
pragma_once = true
cpp_compat = true
documentation = true
documentation_style = "doxy"
style = "type"
no_includes = true
sys_includes = ["stdint.h", "stdbool.h", "stddef.h"]

[export]
# The C-library functions declared in `src/c_runtime.rs` are imports, not
# part of the C API.
exclude = ["Schedule", "ArmableSchedule", "Outcome", "Reinforcer", "ResponseEvent", "ContingencyError", "malloc", "memalign", "free", "abort"]

[parse]
parse_deps = false
