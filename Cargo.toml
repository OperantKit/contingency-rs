[package]
name = "contingency"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/OperantKit/contingency-rs"
description = "Reinforcement contingency engine — Rust port of contingency-py. Mirrors the executable specification defined by the Python package and its conformance fixtures."
# The jsPsych plugin is an npm package that wraps the WebAssembly build; keep it out of the crate.
exclude = ["jspsych/"]

[lib]
name = "contingency"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "contingency-hil"
path = "src/bin/hil.rs"
required-features = ["std"]

[[bin]]
name = "contingency-hil-serial"
path = "src/bin/hil_serial.rs"
required-features = ["serial"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["uniffi"]

[dependencies]
# The schedule core builds without `std` (`--no-default-features`, needs
# `alloc`). Everything that needs an OS sits behind the `std` feature.
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
thiserror = { version = "2", default-features = false }
indexmap = { version = "2", default-features = false }
libm = "0.2"
getrandom = { version = "0.2", optional = true }
anyhow = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
pyo3 = { version = "0.22", optional = true, features = ["extension-module", "abi3-py38"] }
uniffi = { version = "0.28", optional = true, features = ["cli"] }
serialport = { version = "4", optional = true }
libc = { version = "0.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }
serde-wasm-bindgen = "0.6"

[features]
default = ["std"]
std = [
    "serde/std",
    "serde_json/std",
    "thiserror/std",
    "indexmap/std",
    "dep:getrandom",
    "dep:anyhow",
    "dep:clap",
]
# `no_std` only: a global allocator over the C library's malloc/free and
# a panic handler that calls abort(), so the staticlib can be linked into
# C/C++ firmware (e.g. Teensyduino). Cargo builds every listed crate type,
# staticlib included, even when this crate is a dependency, so a no_std
# build needs these two items here, not in the embedding crate.
c-runtime = []
python = ["std", "dep:pyo3"]
uniffi = ["std", "dep:uniffi"]
serial = ["std", "dep:serialport", "dep:libc"]

[build-dependencies]
cbindgen = "0.27"

[dev-dependencies]
proptest = "1"
serde_json = "1"

# Release profile is optimised for the bench harness — debug-assert off,
# overflow checks off, single codegen unit so timing measurements are not
# polluted by per-crate optimisation boundaries.
[profile.release]
lto = "thin"
codegen-units = 1
debug = false
